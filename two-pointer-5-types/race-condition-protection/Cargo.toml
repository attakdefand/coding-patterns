[package]
name = "race-condition-protection"
version = "0.1.0"
edition = "2021"
authors = ["Security Researcher"]
description = "Protection against race conditions and TOCTOU in two-pointer algorithms"
license = "MIT"

[dependencies]
# For thread synchronization primitives
parking_lot = "0.12"
crossbeam = "0.8"
rayon = "1.7"
once_cell = "1.19"
log = "0.4"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "race_condition_benchmarks"
harness = false