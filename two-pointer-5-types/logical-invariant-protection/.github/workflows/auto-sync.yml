name: Auto Sync

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-with-remote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches
        run: |
          git fetch --all

      - name: Sync with remote main branch
        run: |
          # Store current commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          # Pull latest changes
          git pull origin main --ff-only || echo "No fast-forward possible"
          
          # Check if we're behind the remote
          git fetch origin
          REMOTE_COMMIT=$(git rev-parse origin/main)
          
          if [ "$CURRENT_COMMIT" != "$REMOTE_COMMIT" ]; then
            echo "Repository updated"
            echo "updated=true" >> $GITHUB_ENV
          else
            echo "No updates available"
            echo "updated=false" >> $GITHUB_ENV
          fi

      - name: Run tests if updated
        if: env.updated == 'true'
        run: |
          echo "Changes detected, running tests..."
          cargo test

      - name: Notify on updates
        if: env.updated == 'true'
        run: |
          echo "Repository was updated and tests passed"
          # You can add notification commands here (e.g., send to Slack, Discord, etc.)

      - name: Create issue on test failure
        if: failure() && env.updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Auto-sync test failure',
              body: 'Automated tests failed after pulling updates in auto-sync workflow.'
            })